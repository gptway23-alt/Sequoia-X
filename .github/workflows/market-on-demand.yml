
name: Sequoia-X On-demand BaoStock

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "A股六位代码，例如 301363"
        type: string
        required: true
        default: "301363"
      start_date:
        description: "起始日期 YYYY-MM-DD"
        type: string
        required: true
        default: "2026-07-01"
      end_date:
        description: "终止日期 YYYY-MM-DD"
        type: string
        required: true
        default: "2026-10-09"

permissions:
  contents: read

concurrency:
  group: sequoia-on-demand-delivery
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install BaoStock
        run: python -m pip install 'baostock>=0.9,<1'

      - name: Query one symbol without SQLite
        id: fetch_market_data
        env:
          SYMBOL: ${{ inputs.symbol }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import date, datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import baostock as bs
          from sequoia_x.data.market_api import fetch_raw

          symbol = os.environ["SYMBOL"].strip()
          start = os.environ["START_DATE"].strip()
          end = os.environ["END_DATE"].strip()

          if not re.fullmatch(r"[034689][0-9]{5}", symbol):
              raise SystemExit("Invalid six-digit stock symbol")

          try:
              start_day = date.fromisoformat(start)
              end_day = date.fromisoformat(end)
          except ValueError as exc:
              raise SystemExit("Dates must be YYYY-MM-DD") from exc

          if start_day.isoformat() != start or end_day.isoformat() != end:
              raise SystemExit("Dates must use canonical YYYY-MM-DD format")

          if start_day > end_day or (end_day - start_day).days > 400:
              raise SystemExit(
                  "Use a date range of 0 to 400 calendar days"
              )

          if end_day > datetime.now(
              ZoneInfo("Asia/Shanghai")
          ).date():
              raise SystemExit("Future end_date is not allowed")

          result = bs.login()
          if result.error_code != "0":
              raise SystemExit(
                  f"BaoStock login failed: {result.error_msg}"
              )

          try:
              rows = fetch_raw(bs, symbol, start, end)
          finally:
              bs.logout()

          bars = [
              dict(
                  date=d,
                  open=o,
                  high=h,
                  low=lo,
                  close=c,
                  volume=vol,
                  turnover=amt
              )
              for _, d, o, h, lo, c, vol, amt in rows
          ]

          payload = {
              "schema_version": 1,
              "symbol": symbol,
              "source": "baostock_query_history_k_data_plus",
              "adjustment": "NONE",
              "frequency": "1d",
              "request": {
                  "start": start,
                  "end": end
              },
              "fetched_at_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "price_asof": (
                  bars[-1]["date"] if bars else None
              ),
              "is_realtime": False,
              "count": len(bars),
              "status": "OK" if bars else "NO_DATA",
              "bars": bars
          }

          output = (
              Path(os.environ["RUNNER_TEMP"])
              / "market-data.json"
          )
          output.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(
              f"symbol={symbol}, "
              f"bars={len(bars)}, "
              f"price_asof={payload['price_asof']}"
          )
          PY

      - name: Deliver market JSON to GPT-readable Gmail
        id: deliver_email
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SEQUOIA_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SEQUOIA_SMTP_PASSWORD }}
          SMTP_RECIPIENT: gptway23@gmail.com
          SYMBOL: ${{ inputs.symbol }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "market-data.json"
          )

          if not path.is_file():
              raise SystemExit("Market JSON not found")

          payload = json.loads(
              path.read_text(encoding="utf-8")
          )

          if payload.get("status") != "OK":
              raise SystemExit(
                  "Market data status is not OK"
              )

          if payload.get("symbol") != os.environ["SYMBOL"]:
              raise SystemExit("Symbol mismatch")

          bars = payload.get("bars", [])
          if not bars:
              raise SystemExit("No market bars")

          sender = os.environ["SMTP_USER"]
          recipient = os.environ["SMTP_RECIPIENT"]

          if not sender or not os.environ["SMTP_PASSWORD"]:
              raise SystemExit("SMTP secrets missing")

          message = EmailMessage()
          message["From"] = sender
          message["To"] = recipient
          message["Subject"] = (
              "[SEQUOIA-MARKET] "
              f"{payload['symbol']} "
              f"{payload['price_asof']} "
              f"run-{os.environ['GITHUB_RUN_ID']}"
          )

          # JSON 放入邮件正文，方便 GPT 直接读取
          message.set_content(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              charset="utf-8"
          )

          context = ssl.create_default_context()

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              context=context,
              timeout=30
          ) as smtp:
              smtp.login(
                  sender,
                  os.environ["SMTP_PASSWORD"]
              )
              smtp.send_message(message)

          print(
              "Market JSON sent to Gmail; "
              f"symbol={payload['symbol']}; "
              f"bars={len(bars)}; "
              f"run={os.environ['GITHUB_RUN_ID']}"
          )
          PY

      - name: Upload result as artifact
        id: upload_result
        if: ${{ !cancelled() && steps.fetch_market_data.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stock-${{ inputs.symbol }}-${{ github.run_id }}
          path: ${{ runner.temp }}/market-data.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve final delivery status
        if: ${{ !cancelled() }}
        env:
          QUERY_OUTCOME: ${{ steps.fetch_market_data.outcome }}
          EMAIL_OUTCOME: ${{ steps.deliver_email.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_result.outcome }}
        shell: bash
        run: |
          if [ "$QUERY_OUTCOME" != "success" ]; then
            echo "::error::按需行情查询失败: $QUERY_OUTCOME"
            exit 1
          fi
          if [ "$EMAIL_OUTCOME" != "success" ]; then
            echo "::error::行情文件已作为 Artifact 保存（如上传成功），但邮件发送失败: $EMAIL_OUTCOME"
            exit 1
          fi
          if [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "::error::行情 Artifact 保存失败: $ARTIFACT_OUTCOME"
            exit 1
          fi
