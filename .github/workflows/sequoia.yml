
name: Sequoia-X Daily

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "可选目标交易日（YYYY-MM-DD）；留空时使用程序默认日期"
        required: false
        type: string
        default: ""

  schedule:
    # UTC 11:15 = Beijing time 19:15, weekdays.
    - cron: "15 11 * * 1-5"

concurrency:
  group: sequoia-x-daily-mail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-sequoia:
    runs-on: ubuntu-24.04
    # 只读网关不在 Actions 中运行；保留已有策略引擎的定时任务。
    timeout-minutes: 180

    env:
      TZ: Asia/Shanghai
      DB_PATH: data/sequoia_v2.db
      START_DATE: "2024-01-01"
      BAOSTOCK_MAX_WORKERS: "2"
      BAOSTOCK_BATCH_SIZE: "40"
      BAOSTOCK_MAX_ATTEMPTS: "3"
      BAOSTOCK_BACKOFF_SECONDS: "1.0"
      BAOSTOCK_SOCKET_TIMEOUT_SECONDS: "20"
      MIN_DAILY_COVERAGE: "0.98"
      EMAIL_REPORT_DIR: reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"

      # 严格使用仓库中的 uv.lock；随后把隔离环境放入后续步骤的 PATH。
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python 3.11
          uv pip install --python .venv/bin/python -r requirements-gateway.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify source bundle compatibility
        run: |
          python -c "import main; from sequoia_x.data.engine import ENGINE_API_VERSION; assert ENGINE_API_VERSION == main.REQUIRED_ENGINE_API_VERSION == 3"

      - name: Run offline regression tests
        run: pytest -q

      # 安装完成后再恢复 SQLite 数据库
      - name: Restore database
        id: restore-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          # Cache entries are immutable. Include run_attempt so a re-run can
          # save newer, verified progress under the same workflow run_id.
          key: sequoia-db-v10-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sequoia-db-v10-
            sequoia-db-raw-v1-
            sequoia-db-v3-
            sequoia-db-v2-

      - name: Require existing strategy database
        id: initialize_db
        continue-on-error: true
        run: |
          if [ ! -s data/sequoia_v2.db ]; then
            echo "::error::策略数据库不存在。V10 禁止在日常任务中自动全市场回填；请从独立备份恢复策略库。"
            exit 1
          fi
          echo "Existing STRATEGY database restored; no full-universe RAW sync."
          ls -lh data/sequoia_v2.db

      - name: Validate database before daily run
        id: preflight_db
        if: steps.initialize_db.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import sqlite3

          path = os.environ["DB_PATH"]
          if not os.path.isfile(path) or os.path.getsize(path) == 0:
              raise SystemExit(f"Database is missing or empty: {path}")
          with sqlite3.connect(f"file:{path}?mode=rw", uri=True) as connection:
              result = connection.execute("PRAGMA quick_check").fetchone()
              if not result or result[0] != "ok":
                  raise SystemExit(f"SQLite quick_check failed: {result}")
          print("SQLite quick_check: ok")
          PY

      - name: Run Sequoia-X
        id: run_sequoia
        if: >-
          steps.initialize_db.outcome == 'success' &&
          steps.preflight_db.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python main.py --target-date "$TARGET_DATE"
          else
            python main.py
          fi

      - name: Verify database before cache save
        id: verify_db
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import sqlite3

          path = os.environ["DB_PATH"]
          if not os.path.isfile(path) or os.path.getsize(path) == 0:
              raise SystemExit(f"Database is missing or empty: {path}")

          # Use read/write mode without allowing sqlite3 to create a missing
          # file. A successful checkpoint makes the cached DB self-contained
          # even if the application selected WAL journal mode.
          with sqlite3.connect(f"file:{path}?mode=rw", uri=True, timeout=30) as connection:
              checkpoint = connection.execute("PRAGMA wal_checkpoint(FULL)").fetchone()
              if checkpoint and checkpoint[0] != 0:
                  raise SystemExit(f"SQLite WAL checkpoint is busy: {checkpoint}")
              result = connection.execute("PRAGMA quick_check").fetchone()
              if not result or result[0] != "ok":
                  raise SystemExit(f"SQLite quick_check failed: {result}")
          print("SQLite quick_check: ok")
          PY

      # Exactly ONE full-DB cache checkpoint; never expose it to GPT or publish it.
      - name: Save database
        id: save_db
        if: ${{ !cancelled() && steps.verify_db.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: sequoia-db-v10-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload TXT reports only (no database)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequoia-txt-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve final status
        if: ${{ !cancelled() }}
        env:
          INITIALIZE: ${{ steps.initialize_db.outcome }}
          PREFLIGHT: ${{ steps.preflight_db.outcome }}
          RUN: ${{ steps.run_sequoia.outcome }}
          VERIFY: ${{ steps.verify_db.outcome }}
          SAVE: ${{ steps.save_db.outcome }}
        run: |
          for status in "$INITIALIZE" "$PREFLIGHT" "$RUN" "$VERIFY" "$SAVE"; do
            if [ "$status" != "success" ]; then
              echo "::error::Main Sequoia-X daily strategy/checkpoint failed: $status"
              exit 1
            fi
          done
          echo "Daily strategy and local database checkpoint succeeded."
          echo "No GPT database export, Pages raw export, or full-universe raw sync executed."
