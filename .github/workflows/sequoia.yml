name: Sequoia-X Daily

on:
  workflow_dispatch:

  schedule:
    - cron: "15 19 * * 1-5"
      timezone: "Asia/Shanghai"

jobs:
  run-sequoia:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      DB_PATH: data/sequoia_v2.db
      START_DATE: "2025-01-01"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Initialize database if needed
        run: |
          mkdir -p data
          if [ ! -f data/sequoia_v2.db ]; then
            echo "Database not found, starting backfill..."
            python main.py --backfill
          else
            echo "Existing database restored."
          fi

      - name: Run Sequoia-X
        run: |
          python main.py

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
