name: Sequoia-X Daily

on:
  workflow_dispatch:

  schedule:
    - cron: "15 19 * * 1-5"
      timezone: "Asia/Shanghai"

concurrency:
  group: sequoia-x-database-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-sequoia:
    runs-on: ubuntu-latest

    # 全市场回填和偶发的数据源超时可能超过一小时；GitHub 托管任务上限为 6 小时。
    timeout-minutes: 180

    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_TO: "1044757346@qq.com,waygpt23@gmail.com"

      DB_PATH: data/sequoia_v2.db
      START_DATE: "2024-01-01"
      BAOSTOCK_MAX_WORKERS: "2"
      BAOSTOCK_BATCH_SIZE: "25"
      BAOSTOCK_MAX_ATTEMPTS: "2"
      BAOSTOCK_BACKOFF_SECONDS: "1"
      BAOSTOCK_SOCKET_TIMEOUT_SECONDS: "15"
      BAOSTOCK_BATCH_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 必须先安装程序，再恢复 data 目录
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # 安装完成后再恢复 SQLite 数据库
      - name: Restore database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      - name: Initialize database if needed
        run: |
          mkdir -p data

          if [ ! -f data/sequoia_v2.db ]; then
            echo "Database not found, starting backfill..."
            python main.py --backfill
          else
            echo "Existing database restored."
            ls -lh data/sequoia_v2.db
          fi

      - name: Run Sequoia-X
        run: |
          python main.py

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
